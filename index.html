<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 다이어리</title>
<meta name="description" content="날짜별로 사진과 기록을 남기는 나만의 사진 다이어리">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="사진 다이어리">
<style>
:root{
  --bg:#FBF7F0; --bg2:#F4EDE1; --card:#FFFFFF; --ink:#2B2721; --ink2:#5B5348; --muted:#8B8175;
  --line:#EBE1D2; --accent:#BE5B3C; --accent-2:#A34C31; --accent-soft:#F8E7DD;
  --olive:#6E7C4D; --olive-soft:#EEF1E4;
  --shadow:0 1px 2px rgba(80,60,40,.05), 0 8px 18px -14px rgba(80,60,40,.45);
  --r:16px; --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14120E; --bg2:#1C1915; --card:#211E18; --ink:#EFE8DC; --ink2:#CDC4B5; --muted:#988E80;
    --line:#2F2A22; --accent:#E38A63; --accent-2:#F0A07C; --accent-soft:#392A21;
    --olive:#A6B67E; --olive-soft:#2A2E22;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 20px -14px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:16px; line-height:1.5; letter-spacing:-0.01em;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  overflow-y:scroll;
}
body.no-tab{padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;cursor:pointer;appearance:none;-webkit-appearance:none;background:none;border:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font-family:inherit}
img{max-width:100%}
[hidden]{display:none !important}

/* ---------- layout ---------- */
.view{max-width:640px;margin:0 auto;padding:0 16px 28px}
.topbar{
  position:sticky; top:0; z-index:15;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
  max-width:640px; margin:0 auto;
  background:linear-gradient(var(--bg) 78%, rgba(0,0,0,0));
}
.brand{font-size:17px;font-weight:700;letter-spacing:-0.02em}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.icon-btn{
  width:44px;height:44px;display:grid;place-items:center;
  border:1px solid transparent;border-radius:14px;background:transparent;color:var(--ink2)
}
.icon-btn:active{background:var(--bg2)}
.icon-btn svg{width:22px;height:22px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0 10px}
.cal-title{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.cal-title span{font-weight:500;color:var(--muted);font-size:14px;margin-left:4px}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-nav button{
  min-width:44px;height:44px;border:0;background:transparent;border-radius:12px;
  font-size:20px;line-height:1;color:var(--ink2)
}
.cal-nav button:active{background:var(--bg2)}
.cal-nav .today{
  min-width:52px;font-size:13px;font-weight:600;color:var(--accent);
  border:1px solid var(--line);background:var(--card)
}
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 8px 12px;box-shadow:var(--shadow)}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{margin-bottom:4px}
.cal-dow span{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal-dow span.sun{color:var(--accent)}
.cal-cell{
  position:relative;aspect-ratio:1/1;min-height:40px;border:0;background:transparent;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--ink);padding:0
}
.cal-cell .dnum{line-height:1;padding-top:2px}
.cal-cell:active{background:var(--bg2)}
.cal-cell.out{color:var(--muted);opacity:.5}
.cal-cell.sun .dnum{color:var(--accent)}
.cal-cell.today{background:var(--accent-soft);font-weight:700;color:var(--accent-2)}
.cal-cell.today .dnum{color:var(--accent-2)}
.cal-cell.today.has-photo{background:var(--accent-soft)}
.cal-cell.has{background:var(--bg2)}
.cal-cell .dot{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--olive)
}
.cal-cell.has-photo .dot{background:var(--accent)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.section-head h2{font-size:15px;font-weight:700;margin:0}
.section-head .more{font-size:13px;color:var(--muted);background:none;border:0;padding:6px}

.empty-card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;
  text-align:center;box-shadow:var(--shadow);margin-top:8px
}
.empty-card .emoji{font-size:34px;line-height:1}
.empty-card .app-icon{width:72px;height:72px;border-radius:18px;box-shadow:var(--shadow)}
.empty-card h3{font-size:17px;margin:10px 0 6px}
.empty-card p{color:var(--ink2);font-size:14px;margin:0 0 16px;line-height:1.6}
.guide{background:var(--olive-soft);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink2);text-align:left;margin-top:14px;line-height:1.6}
.guide b{color:var(--ink)}

.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-card{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;
  box-shadow:var(--shadow)
}
.recent-card:active{background:var(--bg2)}
.rc-thumb{width:64px;height:64px;flex:0 0 64px;border-radius:12px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:var(--muted);font-size:20px}
.rc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rc-thumb svg{width:22px;height:22px;opacity:.55}
.rc-body{display:block;min-width:0;flex:1}
.rc-body > span{display:block}
.rc-date{font-size:12px;color:var(--muted);margin-bottom:1px}
.rc-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- buttons / fields ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:15px;font-weight:600
}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-2)}
.btn.wide{width:100%}
.btn svg{width:19px;height:19px;flex:0 0 19px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);font-weight:600}
.field{display:block;margin:0 0 14px}
.field > .lab{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 2px 6px}
.field input,.field textarea{
  width:100%;min-height:46px;padding:11px 13px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-size:16px;line-height:1.5;outline:none
}
.field textarea{min-height:104px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  border:1px solid var(--line);background:var(--bg2);color:var(--ink2);
  min-height:34px;padding:0 12px;border-radius:999px;font-size:13.5px
}
.chip:active{background:var(--accent-soft);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- record ---------- */
.rec-head{
  position:sticky;top:0;z-index:16;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  max-width:640px;margin:0 auto;
  background:linear-gradient(var(--bg) 84%, rgba(0,0,0,0));
}
.rec-head .back{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:14px;color:var(--ink2)}
.rec-head .back svg{width:24px;height:24px}
.rec-titles{flex:1;min-width:0;padding-left:2px}
.rec-date{font-size:16px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:12px;color:var(--muted);margin-top:1px}
.save-status{
  font-size:12px;color:var(--muted);opacity:0;transition:opacity .25s;white-space:nowrap;
  min-width:44px;text-align:right;padding-right:2px
}
.save-status.show{opacity:1}
.save-status.saved{color:var(--olive)}

.photo-sec{margin:6px 0 20px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.photo-grid{grid-template-columns:repeat(3,1fr)}}
.photo-empty{
  border:1px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;
  color:var(--muted);font-size:14px;background:var(--card)
}
.tile{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tile-img{
  display:block;position:relative;width:100%;aspect-ratio:1/1;padding:0;border:0;background:var(--bg2);overflow:hidden
}
.tile-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile-img .noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted);line-height:1.4;text-align:center}
.tile-ctl{display:flex;border-top:1px solid var(--line)}
.tile-ctl button{flex:1;height:44px;border:0;background:transparent;color:var(--ink2);font-size:15px;display:grid;place-items:center}
.tile-ctl button:active{background:var(--bg2)}
.tile-ctl button:disabled{opacity:.28}
.tile-ctl button + button{border-left:1px solid var(--line)}
.tile-ctl .del{color:var(--accent)}
.add-row{display:flex;gap:10px;margin-top:12px}
.add-row .btn{flex:1}
.add-note{font-size:12px;color:var(--muted);margin:10px 2px 0;text-align:center}

.stars{display:flex;gap:2px}
.stars button{
  width:44px;height:44px;border:0;background:transparent;font-size:24px;line-height:1;
  color:var(--line);padding:0;display:grid;place-items:center
}
.stars button.on{color:var(--accent)}
.stars .val{font-size:13px;color:var(--muted);align-self:center;margin-left:6px}

/* ---------- gallery ---------- */
.filters{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
.filter-row{display:flex;gap:8px;align-items:center}
.flabel{font-size:12px;color:var(--muted);flex:0 0 30px}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fchips::-webkit-scrollbar{display:none}
.gal-day{margin-bottom:22px}
.gal-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.gal-date{font-size:15px;font-weight:700}
.gal-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal-grid .ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--bg2);border:0;padding:0}
.gal-grid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.more-btn{width:100%;margin-top:8px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:14px}

/* ---------- search ---------- */
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:0 12px;margin:4px 0 16px
}
.search-box svg{width:20px;height:20px;color:var(--muted);flex:0 0 20px}
.search-box input{flex:1;border:0;background:transparent;min-height:48px;font-size:16px;color:var(--ink);outline:none}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none}
.result-card{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;
  box-shadow:var(--shadow)
}
.result-card:active{background:var(--bg2)}
.result-card .rc-thumb{width:58px;height:58px;flex:0 0 58px}
.result-card .rc-title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:14px}
.hint-box{color:var(--muted);font-size:14px;text-align:center;padding:34px 16px;line-height:1.7}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;gap:0;
  background:var(--card);
  background:color-mix(in srgb, var(--card) 92%, transparent);
  border-top:1px solid var(--line);
  backdrop-filter:saturate(140%) blur(12px);-webkit-backdrop-filter:saturate(140%) blur(12px);
  padding-bottom:env(safe-area-inset-bottom)
}
body.no-tab .tabbar{display:none}
.tabbar .tab{
  flex:1;max-width:213px;height:var(--tab-h);border:0;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:11.5px;font-weight:600
}
.tabbar .tab svg{width:23px;height:23px}
.tabbar .tab.on{color:var(--accent)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:70;background:#12100C;display:flex;flex-direction:column;color:#fff}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
.lb-count{font-size:13px;color:rgba(255,255,255,.7);padding-left:6px}
.lb-close{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:20px;border-radius:14px}
.lb-stage{flex:1;display:grid;place-items:center;position:relative;min-height:0;padding:0 6px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:opacity .15s}
.lb-cap{padding:16px 22px 6px;text-align:center}
.lb-date{font-size:12.5px;color:rgba(255,255,255,.62);margin-bottom:5px}
.lb-text{font-size:15px;line-height:1.55;color:#fff}
.lb-navrow{display:flex;align-items:center;justify-content:center;gap:22px;padding:10px 0 calc(env(safe-area-inset-bottom) + 18px)}
.lb-navrow button{
  width:84px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:#fff;font-size:20px;line-height:1
}
.lb-navrow button:disabled{opacity:.25}
.lb-navrow .mid{font-size:12.5px;color:rgba(255,255,255,.55);min-width:46px;text-align:center}
.lb-actions{display:flex;justify-content:center;padding:2px 0 0}
.lb-save{
  display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 18px;border-radius:21px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);
  color:#fff;font-size:13.5px;font-weight:600
}
.lb-save:active{background:rgba(255,255,255,.22)}
.lb-save[disabled]{opacity:.5}
.lb-save svg{width:17px;height:17px}

/* ---------- 앱 안 카메라 ---------- */
.cam{position:fixed;inset:0;z-index:75;background:#0B0A08;display:flex;flex-direction:column;color:#fff}
.cam-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
.cam-title{flex:1;text-align:center;font-size:13.5px;color:rgba(255,255,255,.72)}
.cam-close{width:52px;height:44px;border-radius:14px;font-size:20px;color:#fff;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.cam-close:active{background:rgba(255,255,255,.2)}
.cam-flip{width:52px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cam-flip:active{background:rgba(255,255,255,.2)}
.cam-flip[disabled]{opacity:.4}
.cam-flip .flip-tx{font-size:9.5px;line-height:1;color:rgba(255,255,255,.7);margin-top:-1px}
.cam-stage{flex:1;position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.cam-stage video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.cam-stage video.mirror{transform:scaleX(-1)}
.cam-mode{position:absolute;top:10px;left:12px;padding:5px 11px;border-radius:999px;background:rgba(12,10,8,.55);font-size:11.5px;color:rgba(255,255,255,.92)}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s ease-out}
.cam-flash.on{opacity:.9;transition:none}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.82)}
.cam-strip{display:flex;align-items:center;gap:10px;padding:10px 16px 0;min-height:46px}
.cam-count{font-size:12.5px;color:rgba(255,255,255,.74);white-space:nowrap;display:flex;flex-direction:column;line-height:1.25}
.cam-count .cam-sub{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.5);margin-top:2px}
.cam-thumbs{display:flex;align-items:center;gap:6px;flex:1;min-height:44px;overflow-x:auto;justify-content:flex-end}
.cam-thumbs img{width:44px;height:44px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.28);flex:0 0 auto}
.cam-thumbs .slot{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:10px;color:rgba(255,255,255,.62);flex:0 0 auto}
.cam-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;padding:12px 18px calc(env(safe-area-inset-bottom) + 18px)}
.cam-done{justify-self:start;height:44px;padding:0 20px;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:600}
.cam-done:active{background:rgba(255,255,255,.26)}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(255,255,255,.22);display:grid;place-items:center}
.shutter::after{content:'';width:56px;height:56px;border-radius:50%;background:#fff;display:block}
.shutter:active{background:rgba(255,255,255,.5)}
.shutter[disabled]{opacity:.4}

/* ---------- modal / sheet / toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(24,18,12,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.backdrop.center{align-items:center;padding:20px}
.sheet{
  width:100%;max-width:640px;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto
}
.sheet{position:relative}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.sheet-close{
  position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:14px;
  color:var(--ink2);font-size:18px;display:grid;place-items:center
}
.sheet-close:active{background:var(--bg2)}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet .sub{font-size:13px;color:var(--muted);margin:0 0 16px}
.sheet-row{background:var(--bg2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sheet-row h3{font-size:14px;margin:0 0 4px}
.sheet-row p{font-size:12.5px;color:var(--ink2);margin:0 0 10px;line-height:1.6}
.sheet-row .btns{display:flex;gap:8px}
.sheet-row .btns .btn{flex:1}
.sheet-row .sw-row{display:flex;align-items:flex-start;gap:12px}

<script>
(function(){
'use strict';

/* ============================================================
   사진 다이어리 — 단일 페이지 PWA (프레임워크 없음)
   저장: IndexedDB (기기 안에만, 서버·로그인 없음)
   ============================================================ */

/* ---------- 상수 ---------- */
var APP_VERSION = '1.3.0';
var DL_REVOKE_MS = 10000; // 연속 촬영 때 다운로드가 씹히지 않도록 objectURL 은 늦게 해제한다
var DB_NAME = 'photo-diary';
var DB_VER = 1;
var THUMB_MAX = 480;
var THUMB_Q = 0.82;
var PHOTO_MAX = 1920;   // 저장하는 사진의 최대 변(고화소 원본은 이 크기로 줄여 저장)
var PHOTO_Q = 0.88;     // 저장 사진 JPEG 품질
var CAPTURE_MAX = 1600; // 앱 안 카메라로 찍은 사진의 최대 변
var WEEK = ['일','월','화','수','목','금','토'];
var NOIMG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.6" width="17" height="14.8" rx="3.2"/><circle cx="9" cy="10" r="1.4"/><path d="M4.6 17.6l4.1-4.1 3.3 3.3 2.5-2.5 3.9 3.9"/></svg>';

/* ---------- 짧은 도우미 ---------- */
function $(sel, root){ return (root || document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function pad2(n){ return n < 10 ? '0' + n : String(n); }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseYmd(s){
  var p = String(s).split('-').map(Number);
  return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
}
function koreanDate(s){
  var d = parseYmd(s);
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + WEEK[d.getDay()] + '요일';
}
function shortDate(s){
  var d = parseYmd(s);
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';
}
function relDay(s){
  if (s === todayStr()) return '오늘';
  var y = new Date(); y.setDate(y.getDate() - 1);
  if (s === ymd(y)) return '어제';
  return '';
}
function splitPeople(v){
  return String(v || '').split(/[,、·\/\n]/).map(function(x){ return x.trim(); }).filter(Boolean);
}
function truncate(s, n){
  s = String(s || '').replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

/* ---------- IndexedDB ---------- */
var db = null;

function openDB(){
  return new Promise(function(resolve, reject){
    var rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = function(){
      var d = rq.result;
      if (!d.objectStoreNames.contains('days')) {
        d.createObjectStore('days', { keyPath: 'date' });
      }
      if (!d.objectStoreNames.contains('photos')) {
        var ps = d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
        ps.createIndex('by-date', 'date', { unique: false });
      }
      if (!d.objectStoreNames.contains('photoIndex')) {
        var pi = d.createObjectStore('photoIndex', { keyPath: 'id' });
        pi.createIndex('by-date', 'date', { unique: false });
      }
    };
    rq.onsuccess = function(){ db = rq.result; resolve(db); };
    rq.onerror = function(){ reject(rq.error); };
    rq.onblocked = function(){ /* 다른 탭이 옛 버전을 쓰는 중 */ };
  });
}
function getAll(store){
  return new Promise(function(resolve, reject){
    var t = db.transaction(store, 'readonly');
    var r = t.objectStore(store).getAll();
    r.onsuccess = function(){ resolve(r.result || []); };
    r.onerror = function(){ reject(r.error); };
  });
}
function getOne(store, key){
  return new Promise(function(resolve, reject){
    var r = db.transaction(store, 'readonly').objectStore(store).get(key);
    r.onsuccess = function(){ resolve(r.result || null); };
    r.onerror = function(){ reject(r.error); };
  });
}
function putOne(store, value){
  return new Promise(function(resolve, reject){
    var t = db.transaction(store, 'readwrite');
    t.objectStore(store).put(value);
    t.oncomplete = function(){ resolve(); };
    t.onerror = function(){ reject(t.error); };
    t.onabort = function(){ reject(t.error || new Error('abort')); };
  });
}
function delOne(store, key){
  return new Promise(function(resolve, reject){
    var t = db.transaction(store, 'readwrite');
    t.objectStore(store).delete(key);
    t.oncomplete = function(){ resolve(); };
    t.onerror = function(){ reject(t.error); };
    t.onabort = function(){ reject(t.error || new Error('abort')); };
  });
}
/* 사진 추가: photos(원본 포함) + photoIndex(목록용) 를 한 트랜잭션으로 */
function addPhotoRecord(rec){
  return new Promise(function(resolve, reject){
    var t = db.transaction(['photos', 'photoIndex'], 'readwrite');
    var id = null;
    var addReq = t.objectStore('photos').add({
      date: rec.date,
      blob: rec.blob,
      thumb: rec.thumb || null,
      order: rec.order,
      caption: rec.caption || ''
    });
    addReq.onsuccess = function(){
      id = addReq.result;
      t.objectStore('photoIndex').put({
        id: id,
        date: rec.date,
        order: rec.order,
        caption: rec.caption || '',
        thumb: rec.thumb || null
      });
    };
    t.oncomplete = function(){ resolve(id); };
    t.onerror = function(){ reject(t.error); };
    t.onabort = function(){ reject(t.error || new Error('abort')); };
  });
}
function deletePhotoRecord(id){
  return new Promise(function(resolve, reject){
    var t = db.transaction(['photos', 'photoIndex'], 'readwrite');
    t.objectStore('photos').delete(id);
    t.objectStore('photoIndex').delete(id);
    t.oncomplete = function(){ resolve(); };
    t.onerror = function(){ reject(t.error); };
    t.onabort = function(){ reject(t.error || new Error('abort')); };
  });
}
/* 순서 값 저장: [{id, order}] */
function saveOrderValues(pairs){
  if (!pairs.length) return Promise.resolve();
  return new Promise(function(resolve, reject){
    var t = db.transaction(['photos', 'photoIndex'], 'readwrite');
    var ps = t.objectStore('photos');
    var pi = t.objectStore('photoIndex');
    pairs.forEach(function(pair){
      var g1 = ps.get(pair.id);
      g1.onsuccess = function(){
        var v = g1.result;
        if (v) { v.order = pair.order; ps.put(v); }
      };
      var g2 = pi.get(pair.id);
      g2.onsuccess = function(){
        var v = g2.result;
        if (v) { v.order = pair.order; pi.put(v); }
      };
    });
    t.oncomplete = function(){ resolve(); };
    t.onerror = function(){ reject(t.error); };
    t.onabort = function(){ reject(t.error || new Error('abort')); };
  });
}
/* 백업 가져오기용: 백업의 id를 그대로 살려서 추가 (photos는 keyPath id를 쓰므로 값 안에 넣는다) */
function importPhotoRecord(id, rec){
  return new Promise(function(resolve, reject){
    var t = db.transaction(['photos', 'photoIndex'], 'readwrite');
    var r = t.objectStore('photos').add({
      id: id,
      date: rec.date,
      blob: rec.blob,
      thumb: rec.thumb || null,
      order: rec.order || 0,
      caption: rec.caption || ''
    });
    r.onsuccess = function(){
      t.objectStore('photoIndex').put({
        id: id,
        date: rec.date,
        order: rec.order || 0,
        caption: rec.caption || '',
        thumb: rec.thumb || null
      });
    };
    r.onerror = function(){ /* 트랜잭션 error 로 처리 */ };
    t.oncomplete = function(){ resolve(true); };
    t.onerror = function(){ reject(t.error); };
    t.onabort = function(){ reject(t.error || new Error('abort')); };
  });
}

/* ---------- 상태 ---------- */
var S = {
  tab: 'calendar',
  view: 'main',
  calDate: new Date(),
  recordDate: null,
  draft: null,
  recordPhotos: [],
  days: [],
  photoIndex: [],
  galleryFilter: { people: null, place: null },
  galleryOpen: {},
  searchQuery: '',
  saveTimer: null,
  saveState: 'idle',
  lb: null,
  historyPushed: false
};

var thumbUrls = {};
var fullUrls = {};

function thumbUrl(p){
  if (!p || !p.thumb) return '';
  if (!thumbUrls[p.id]) {
    try { thumbUrls[p.id] = URL.createObjectURL(p.thumb); }
    catch (e) { return ''; }
  }
  return thumbUrls[p.id];
}
function forgetThumb(id){
  if (thumbUrls[id]) { try { URL.revokeObjectURL(thumbUrls[id]); } catch(e){} delete thumbUrls[id]; }
  if (fullUrls[id]) { try { URL.revokeObjectURL(fullUrls[id]); } catch(e){} delete fullUrls[id]; }
}
function forgetFull(id){
  if (fullUrls[id]) { try { URL.revokeObjectURL(fullUrls[id]); } catch(e){} delete fullUrls[id]; }
}
async function fullUrl(id){
  if (fullUrls[id]) return fullUrls[id];
  var rec = await getOne('photos', id);
  if (!rec || !rec.blob) return '';
  fullUrls[id] = URL.createObjectURL(rec.blob);
  return fullUrls[id];
}

/* ---------- 갤러리(다운로드) 저장 ----------
 * 찍은 사진을 휴대폰의 Download 폴더(=갤러리)에도 남긴다.
 * <a download>로 내려받으면 안드로이드 크롬에서는 다운로드 폴더에 저장되고
 * 갤러리 앱에 바로 보인다.
 */
var PREFS_KEY = 'photo-diary:prefs';
var prefs = { gallerySave: true }; // 기본값 켜짐
var dlPending = [];
var dlLastSec = '';
var dlSecCount = 0;

function loadPrefs(){
  try {
    var raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && typeof o.gallerySave === 'boolean') prefs.gallerySave = o.gallerySave;
  } catch (e) { /* 저장소를 못 쓰는 브라우저는 기본값으로 */ }
}
function savePrefs(){
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ gallerySave: !!prefs.gallerySave })); } catch (e) {}
}
loadPrefs();

/* 다이어리-YYYYMMDD-HHMMSS-순번.jpg
 * 같은 초에 여러 장 찍어도 순번이 올라가 이름이 겹치지 않는다.
 * (브라우저도 같은 이름이 있으면 (1)을 붙여 준다)
 */
function photoExt(blob){
  // 카메라·불러오기는 JPEG로 저장되지만, 변환되지 않은 사진(HEIC 등)은 원본 형식을 따른다
  var t = String((blob && blob.type) || '').toLowerCase();
  if (t === 'image/png') return 'png';
  if (t === 'image/webp') return 'webp';
  if (t === 'image/heic' || t === 'image/heif') return 'heic';
  return 'jpg';
}
function photoFileName(date, blob){
  var now = new Date();
  var day = String(date || '').replace(/[^0-9]/g, '');
  if (day.length !== 8) day = ymd(now).replace(/-/g, '');
  var sec = pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds());
  if (sec !== dlLastSec) { dlLastSec = sec; dlSecCount = 0; }
  dlSecCount += 1;
  return '다이어리-' + day + '-' + sec + '-' + pad2(dlSecCount) + '.' + photoExt(blob);
}
/* 파일 하나를 내려받는다. objectURL 은 충분히(10초) 뒤에 해제한다. */
function downloadBlob(blob, name){
  if (!blob || !name) return '';
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    dlPending.push({ url: url, a: a, name: name });
    setTimeout(function(){
      try { if (a.parentNode) a.parentNode.removeChild(a); } catch (e) {}
      try { URL.revokeObjectURL(url); } catch (e) {}
      dlPending = dlPending.filter(function(x){ return x.url !== url; });
    }, DL_REVOKE_MS);
    return name;
  } catch (e) {
    console.warn('갤러리 저장 실패', e);
    return '';
  }
}

/* ---------- 데이터 조회 도우미 ---------- */
function dayOf(date){
  for (var i = 0; i < S.days.length; i++) if (S.days[i].date === date) return S.days[i];
  return null;
}
function hasContent(day){
  if (!day) return false;
  return !!(day.title || day.people || day.place || day.food || (day.memo && day.memo.trim()) || (day.rating > 0));
}
function photosOf(date){
  return S.photoIndex
    .filter(function(p){ return p.date === date; })
    .sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
}
function marksMap(){
  var map = {};
  S.days.forEach(function(d){
    if (hasContent(d)) map[d.date] = { day: true, photo: false };
  });
  S.photoIndex.forEach(function(p){
    if (!map[p.date]) map[p.date] = { day: false, photo: false };
    map[p.date].photo = true;
  });
  return map;
}
function allDatesWithContent(){
  var map = marksMap();
  return Object.keys(map).sort().reverse();
}
function recentEntries(limit){
  var map = {};
  S.days.forEach(function(d){
    if (!hasContent(d)) return;
    map[d.date] = { date: d.date, day: d, photo: null, count: 0 };
  });
  S.photoIndex.forEach(function(p){
    if (!map[p.date]) map[p.date] = { date: p.date, day: dayOf(p.date), photo: null, count: 0 };
    map[p.date].count++;
    if (!map[p.date].photo) map[p.date].photo = p;
  });
  var arr = Object.keys(map).map(function(k){ return map[k]; });
  arr.sort(function(a, b){ return b.date.localeCompare(a.date); });
  return arr.slice(0, limit || 4);
}

/* ---------- 저장(자동) ---------- */
function setStatus(state){
  S.saveState = state;
  var el = $('#save-status');
  if (!el) return;
  if (state === 'typing') { el.textContent = ''; el.className = 'save-status'; }
  else if (state === 'saving') { el.textContent = '저장 중…'; el.className = 'save-status show'; }
  else if (state === 'saved') { el.textContent = '저장됨'; el.className = 'save-status show saved'; }
}
function scheduleSave(){
  setStatus('typing');
  if (S.saveTimer) clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(function(){ S.saveTimer = null; saveDay(); }, 400);
}
async function saveDay(){
  if (S.saveTimer) { clearTimeout(S.saveTimer); S.saveTimer = null; }
  if (!S.recordDate || !S.draft) return;
  var date = S.recordDate;
  var prev = dayOf(date);
  var now = new Date().toISOString();
  var d = S.draft;
  var day = {
    date: date,
    title: (d.title || '').trim(),
    people: (d.people || '').trim(),
    place: (d.place || '').trim(),
    food: (d.food || '').trim(),
    memo: d.memo || '',
    rating: d.rating || 0,
    createdAt: prev && prev.createdAt ? prev.createdAt : now,
    updatedAt: now
  };
  var empty = !day.title && !day.people && !day.place && !day.food && !(day.memo && day.memo.trim()) && !day.rating;
  setStatus('saving');
  try {
    if (empty && S.recordPhotos.length === 0) {
      if (prev) { await delOne('days', date); S.days = S.days.filter(function(x){ return x.date !== date; }); }
    } else {
      await putOne('days', day);
      var idx = -1;
      for (var i = 0; i < S.days.length; i++) if (S.days[i].date === date) { idx = i; break; }
      if (idx >= 0) S.days[idx] = day; else S.days.push(day);
    }
    setStatus('saved');
  } catch (e) {
    console.error('저장 실패', e);
    setStatus('idle');
    toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  }
}
async function flushSave(){
  if (S.saveTimer || S.saveState === 'typing') {
    await saveDay();
  }
}

/* ---------- 썸네일 ---------- */
function loadImageElement(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){ resolve({ img: img, url: url, w: img.naturalWidth, h: img.naturalHeight }); };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
/* ---------- 사진 크기 읽기(디코딩 없이) ---------- */
/* 파일 머리에서 원본 픽셀 크기를 읽는다. 모르면 null(HEIC 등). */
function imageSizeFromHeader(blob){
  return new Promise(function(resolve){
    try {
      var fr = new FileReader();
      fr.onload = function(){
        try { resolve(parseImageSize(new Uint8Array(fr.result))); }
        catch (e) { resolve(null); }
      };
      fr.onerror = function(){ resolve(null); };
      fr.readAsArrayBuffer(blob.slice(0, 262144));
    } catch (e) { resolve(null); }
  });
}
function parseImageSize(b){
  if (!b || b.length < 24) return null;
  // JPEG
  if (b[0] === 0xFF && b[1] === 0xD8) {
    var i = 2;
    while (i + 9 < b.length) {
      if (b[i] !== 0xFF) { i++; continue; }
      var m = b[i + 1];
      if (m === 0xD8 || m === 0xD9 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { i += 2; continue; }
      var len = (b[i + 2] << 8) | b[i + 3];
      if (len < 2) return null;
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
        var jh = (b[i + 5] << 8) | b[i + 6];
        var jw = (b[i + 7] << 8) | b[i + 8];
        return (jw && jh) ? { w: jw, h: jh } : null;
      }
      i += 2 + len;
    }
    return null;
  }
  // PNG
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) {
    var pw = (b[16] << 24) | (b[17] << 16) | (b[18] << 8) | b[19];
    var ph = (b[20] << 24) | (b[21] << 16) | (b[22] << 8) | b[23];
    return (pw > 0 && ph > 0) ? { w: pw, h: ph } : null;
  }
  // WebP
  if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&
      b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) {
    var four = String.fromCharCode(b[12], b[13], b[14], b[15]);
    if (four === 'VP8X') {
      var xw = 1 + (b[21] | (b[22] << 8) | (b[23] << 16));
      var xh = 1 + (b[24] | (b[25] << 8) | (b[26] << 16));
      return (xw > 1 && xh > 1) ? { w: xw, h: xh } : null;
    }
    if (four === 'VP8 ') {
      var vw = (b[26] | (b[27] << 8)) & 0x3FFF;
      var vh = (b[28] | (b[29] << 8)) & 0x3FFF;
      return (vw && vh) ? { w: vw, h: vh } : null;
    }
    if (four === 'VP8L') {
      var bits = (b[21] | (b[22] << 8) | (b[23] << 16) | (b[24] << 24)) >>> 0;
      var lw = (bits & 0x3FFF) + 1;
      var lh = ((bits >> 14) & 0x3FFF) + 1;
      return (lw > 1 && lh > 1) ? { w: lw, h: lh } : null;
    }
    return null;
  }
  return null;
}

/* ---------- 축소 디코딩 ---------- */
/* createImageBitmap 의 resizeWidth/resizeHeight 로 '줄여서' 디코딩한다.
   큰 사진을 풀사이즈로 디코딩하지 않아 메모리 피크가 크게 줄어든다. */
async function decodeScaled(source, maxEdge){
  if (typeof createImageBitmap === 'function') {
    try {
      var opts = { imageOrientation: 'from-image' };
      var known = await imageSizeFromHeader(source);
      if (known) {
        if (Math.max(known.w, known.h) > maxEdge) {
          if (known.w >= known.h) opts.resizeWidth = maxEdge;
          else opts.resizeHeight = maxEdge;
        }
      } else {
        // 크기를 모르는 형식: 64px 미리보기로 가로/세로 방향만 먼저 확인
        var probe = null;
        try { probe = await createImageBitmap(source, { imageOrientation: 'from-image', resizeWidth: 64 }); }
        catch (e) { probe = null; }
        if (probe) {
          if (probe.width >= probe.height) opts.resizeWidth = maxEdge;
          else opts.resizeHeight = maxEdge;
          try { probe.close(); } catch (e) {}
        }
      }
      var bmp = await createImageBitmap(source, opts);
      return {
        img: bmp, w: bmp.width, h: bmp.height,
        close: function(){ try { bmp.close(); } catch (e) {} }
      };
    } catch (e) { /* 아래 <img> 경로로 */ }
  }
  var loaded = await loadImageElement(source);
  return {
    img: loaded.img, w: loaded.w, h: loaded.h,
    close: function(){ try { URL.revokeObjectURL(loaded.url); } catch (e) {} }
  };
}
async function resizeToJpeg(source, maxEdge, quality){
  var dec = await decodeScaled(source, maxEdge);
  try {
    if (!dec.w || !dec.h) throw new Error('size unknown');
    var scale = Math.min(1, maxEdge / Math.max(dec.w, dec.h));
    var tw = Math.max(1, Math.round(dec.w * scale));
    var th = Math.max(1, Math.round(dec.h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = tw; canvas.height = th;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, tw, th);
    if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(dec.img, 0, 0, tw, th);
    var blob = await new Promise(function(resolve){
      canvas.toBlob(function(b){ resolve(b); }, 'image/jpeg', quality);
    });
    canvas.width = canvas.height = 0; // 캔버스 메모리 즉시 해제
    return blob;
  } finally {
    dec.close();
  }
}
async function makeThumb(source){
  return resizeToJpeg(source, THUMB_MAX, THUMB_Q);
}
/* 저장용 사진: 이미 작으면 원본 그대로, 고화소면 최대 변 PHOTO_MAX JPEG 로 줄여서 */
async function prepareForStore(file){
  var size = await imageSizeFromHeader(file);
  var longEdge = size ? Math.max(size.w, size.h) : 0;
  if (longEdge && longEdge <= PHOTO_MAX) return file;
  if (!longEdge && file.size && file.size <= 400 * 1024) return file;
  var blob = await resizeToJpeg(file, PHOTO_MAX, PHOTO_Q);
  return blob || file;
}

/* ---------- 화면: 기록 ---------- */
/* 화면 상태를 주소에 남긴다(#day=YYYY-MM-DD) — 앱이 새로고침·재시작돼도 같은 날 기록으로 */
function readHashDay(){
  var m = /^#day=(\d{4})-(\d{2})-(\d{2})$/.exec(String(location.hash || ''));
  return m ? m[1] + '-' + m[2] + '-' + m[3] : null;
}
function clearHashDay(){
  try {
    if (String(location.hash || '').indexOf('#day=') === 0) {
      history.replaceState(history.state, '', location.pathname + location.search);
    }
  } catch (e) {}
}
function syncHashDay(date){
  try {
    var h = '#day=' + date;
    if (location.hash === h) {
      if (!history.state || history.state.record !== date) history.replaceState({ record: date }, '', h);
      S.historyPushed = true;
      return;
    }
    history.pushState({ record: date }, '', h);
    S.historyPushed = true;
  } catch (e) {
    S.historyPushed = false;
  }
}

async function openRecord(date, keepHistory){
  await flushSave();
  S.recordDate = date;
  var day = dayOf(date);
  S.draft = {
    title: day ? (day.title || '') : '',
    people: day ? (day.people || '') : '',
    place: day ? (day.place || '') : '',
    food: day ? (day.food || '') : '',
    memo: day ? (day.memo || '') : '',
    rating: day ? (day.rating || 0) : 0
  };
  S.recordPhotos = photosOf(date);
  S.view = 'record';
  S.saveState = 'idle';
  render();
  window.scrollTo(0, 0);
  if (!keepHistory && !S.historyPushed) syncHashDay(date);
}
function closeRecord(){
  clearHashDay();
  S.view = 'main';
  S.recordDate = null;
  S.draft = null;
  S.recordPhotos = [];
  render();
  window.scrollTo(0, 0);
}
function backFromRecord(){
  flushSave();
  if (S.historyPushed) {
    S.historyPushed = false;
    try { history.back(); return; } catch (e) {}
  }
  closeRecord();
}
window.addEventListener('popstate', function(){
  if (cam) { stopCamera(); return; } // 뒤로 가기 = 카메라만 닫기
  var hd = readHashDay();
  if (hd) { // 앞으로가기 등으로 다시 #day= 주소가 되면 그 기록을 연다
    S.historyPushed = true;
    if (S.view !== 'record' || S.recordDate !== hd) openRecord(hd, true);
    return;
  }
  if (S.view === 'record') {
    S.historyPushed = false;
    flushSave();
    closeRecord();
  }
});

function renderStars(){

function updateChips(){
  if (!S.draft) return;
  var peopleBox = $('#chips-people');
  if (peopleBox) {
    var own = splitPeople(S.draft.people).map(function(x){ return x.toLowerCase(); });
    var counts = {};
    S.days.forEach(function(day){
      splitPeople(day.people).forEach(function(n){
        if (own.indexOf(n.toLowerCase()) >= 0) return;
        counts[n] = (counts[n] || 0) + 1;
      });
    });
    var list = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; }).slice(0, 8);
    peopleBox.innerHTML = list.map(function(n){
      return '<button type="button" class="chip" data-chip-people="' + esc(n) + '">' + esc(n) + '</button>';
    }).join('');
    peopleBox.hidden = list.length === 0;
  }
  var placeBox = $('#chips-place');
  if (placeBox) {
    var cur = (S.draft.place || '').trim();
    var pcount = {};
    S.days.forEach(function(day){
      var p = (day.place || '').trim();
      if (!p || p === cur) return;
      pcount[p] = (pcount[p] || 0) + 1;
    });
    var plist = Object.keys(pcount).sort(function(a, b){ return pcount[b] - pcount[a]; }).slice(0, 8);
    if (cur && plist.indexOf(cur) < 0) plist.unshift(cur);
    placeBox.innerHTML = plist.filter(function(p){ return p !== cur; }).map(function(p){
      return '<button type="button" class="chip" data-chip-place="' + esc(p) + '">' + esc(p) + '</button>';
    }).join('');
    placeBox.hidden = placeBox.children.length === 0;
  }
}

  var grid = $('#photo-grid');
  if (!grid) return;
  var ps = S.recordPhotos.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
  if (!ps.length) {
    grid.innerHTML = '<div class="photo-empty" style="grid-column:1/-1">아직 사진이 없어요.<br>아래 버튼으로 찍거나 불러와 주세요.</div>';
    var sub0 = $('#rec-sub');
    if (sub0) {
      var bits = [];
      var rel = relDay(S.recordDate);
      if (rel) bits.push(rel);
      bits.push('사진 없음');
      sub0.textContent = bits.join(' · ');
    }
    return;
  }
  grid.innerHTML = ps.map(function(p, i){
    var u = thumbUrl(p);
    var inner = u ? '<img src="' + u + '" alt="사진 ' + (i + 1) + '" loading="lazy">'
                  : '<span class="noimg">미리보기를<br>만들 수 없는 사진</span>';
    return '<figure class="tile" data-id="' + p.id + '">' +
      '<button class="tile-img" data-act="open" data-id="' + p.id + '" aria-label="사진 ' + (i + 1) + ' 크게 보기">' + inner + '</button>' +
      '<figcaption class="tile-ctl">' +
        '<button data-act="left" data-id="' + p.id + '" aria-label="앞 순서로"' + (i === 0 ? ' disabled' : '') + '>◀</button>' +
        '<button data-act="right" data-id="' + p.id + '" aria-label="뒤 순서로"' + (i === ps.length - 1 ? ' disabled' : '') + '>▶</button>' +
        '<button class="del" data-act="del" data-id="' + p.id + '" aria-label="사진 삭제">✕</button>' +
      '</figcaption>' +
    '</figure>';
  }).join('');

  var sub = $('#rec-sub');
  if (sub) {
    var b2 = [];
    var r2 = relDay(S.recordDate);
    if (r2) b2.push(r2);
    b2.push('사진 ' + ps.length + '장');
    sub.textContent = b2.join(' · ');
  }
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if (!b || !b.closest('#photo-grid')) return;
  var act = b.getAttribute('data-act');
  var id = Number(b.getAttribute('data-id'));
  if (act === 'open') {
    var ps = S.recordPhotos.slice().sort(function(a, c){ return (a.order || 0) - (c.order || 0); });
    var i = ps.findIndex(function(p){ return p.id === id; });
    openLightbox(ps, i < 0 ? 0 : i);
  } else if (act === 'left') {
    movePhoto(id, -1);
  } else if (act === 'right') {
    movePhoto(id, 1);
  } else if (act === 'del') {
    askDeletePhoto(id);
  }
});

function normalizeOrders(){
  var ps = S.recordPhotos.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
  ps.forEach(function(p, i){ p.order = i; });
  S.recordPhotos = ps;
  return ps.map(function(p){ return { id: p.id, order: p.order }; });
}
async function movePhoto(id, dir){
  var ps = S.recordPhotos.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
  var i = ps.findIndex(function(p){ return p.id === id; });
  var j = i + dir;
  if (i < 0 || j < 0 || j >= ps.length) return;
  var tmp = ps[i]; ps[i] = ps[j]; ps[j] = tmp;
  ps.forEach(function(p, k){ p.order = k; });
  S.recordPhotos = ps;
  renderPhotoGrid();
  try { await saveOrderValues(ps.map(function(p){ return { id: p.id, order: p.order }; })); }
  catch (e) { console.error(e); toast('순서를 저장하지 못했어요.'); }
}
async function askDeletePhoto(id){
  var ok = await confirmDialog('이 사진을 지울까요?', '이 휴대폰의 다이어리에서만 지워집니다. 되돌릴 수 없어요.', '지우기', '취소');
  if (!ok) return;
  try {
    await deletePhotoRecord(id);
    S.recordPhotos = S.recordPhotos.filter(function(p){ return p.id !== id; });
    S.photoIndex = S.photoIndex.filter(function(p){ return p.id !== id; });
    forgetThumb(id);
    renderPhotoGrid();
    toast('사진을 지웠어요.');
  } catch (e) {
    console.error(e);
    toast('사진을 지우지 못했어요.');
  }
}
async function handleFiles(fileList){
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;
  var date = S.recordDate;
  if (!date) return;
  var total = files.length;
  showBusy('사진 저장 중… 0/' + total);
  var added = 0, failed = 0;
  var order = S.recordPhotos.reduce(function(m, p){ return Math.max(m, p.order || 0); }, -1) + 1;
  for (var i = 0; i < total; i++) {
    var f = files[i];
    updateBusy('사진 저장 중… ' + (i + 1) + '/' + total);
    var stored = f;
    try { stored = await prepareForStore(f); } catch (e) { stored = f; }
    var thumb = null;
    try { thumb = await makeThumb(stored); } catch (e) { thumb = null; }
    var rec = { date: date, blob: stored, thumb: thumb, order: order++, caption: '' };
    try {
      var id = await addPhotoRecord(rec);
      var meta = { id: id, date: date, order: rec.order, caption: '', thumb: thumb };
      S.recordPhotos.push(meta);
      S.photoIndex.push(meta);
      added++;
    } catch (e) {
      console.error('사진 저장 실패', e);
      failed++;
    }
  }
  hideBusy();
  if (S.recordDate === date) {
    renderPhotoGrid();
    await saveOrderValues(normalizeOrders());
    if (S.draft && S.saveState === 'idle' && !dayOf(date)) { /* 사진만 있는 날 */ }
  }
  if (added && failed) toast(added + '장을 담았어요. ' + failed + '장은 저장하지 못했어요.');
  else if (added) toast(added + '장을 담았어요.');
  else toast('사진을 담지 못했어요. 다른 사진으로 다시 시도해 주세요.');
}

/* ---------- 앱 안 카메라 ----------
 * 안드로이드에서 <input type="file" capture>로 외부 카메라 앱을 띄우면
 * 카메라 앱이 메모리를 많이 써서 뒤에 있던 이 앱이 시스템에 종료된다
 * ("메모리가 부족하여 이전 작업을 완료할 수 없습니다").
 * 그래서 앱 안에서 미리보기 + 촬영을 하고, 찍은 뒤 스트림을 바로 끊는다.
 */
var cam = null;
var camBusy = false;

function cameraAvailable(){
  return !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function');
}
function cameraFallback(msg){
  if (msg) toast(msg, 4000);
  var input = $('#file-capture');
  if (input) setTimeout(function(){ try { input.click(); } catch (e) {} }, 80);
}
/* 카메라 스트림은 찍는 동안 계속 열어 두고, 닫을 때 한 번에 정리한다.
 * (예전에는 한 장 찍을 때마다 스트림을 끊어서 연속 촬영이 안 됐다)
 */
function stopCamera(){
  if (!cam) return;
  try {
    if (cam.stream) cam.stream.getTracks().forEach(function(tr){ try { tr.stop(); } catch (e) {} });
  } catch (e) {}
  try { if (cam.video) cam.video.srcObject = null; } catch (e) {}
  try { (cam.urls || []).forEach(function(u){ try { URL.revokeObjectURL(u); } catch (e) {} }); } catch (e) {}
  try { if (cam.el && cam.el.parentNode) cam.el.parentNode.removeChild(cam.el); } catch (e) {}
  document.removeEventListener('keydown', camKeys);
  cam = null;
  camBusy = false;
}
/* 카메라를 닫으면(✕·완료·뒤로 가기) 쌓아 둔 히스토리 한 칸도 같이 되돌린다 */
function closeCamera(){
  var pushed = !!(cam && cam.historyPushed);
  stopCamera();
  if (pushed) { try { history.back(); } catch (e) {} }
}
function camKeys(e){
  if (!cam) return;
  if (e.key === 'Escape') closeCamera();
}
/* facingMode 를 그대로 못 받는 기기를 위해 한 번 더 넓게 요청한다 */
async function camGetStream(mode){
  try {
    // 고화소 스트림은 그 자체로 메모리를 많이 쓰므로 1920 이하로 요청한다
    return await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: mode }, width: { ideal: 1920 }, height: { ideal: 1920 } }
    });
  } catch (err) {
    var name = (err && err.name) || '';
    if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'NotReadableError') throw err;
    return await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
  }
}
function camApplyMode(mode){
  if (!cam) return;
  cam.facing = mode;
  // 셀카는 미리보기만 거울처럼 보여 준다(저장되는 사진은 실제 방향 그대로)
  if (cam.video) cam.video.classList.toggle('mirror', mode === 'user');
  var lab = $('#cam-mode');
  if (lab) lab.textContent = mode === 'user' ? '셀카' : '후면 카메라';
  var flip = $('#cam-flip');
  if (flip) flip.setAttribute('aria-label', mode === 'user' ? '후면 카메라로 전환' : '셀카 카메라로 전환');
}
async function switchCamera(){
  if (!cam || cam.switching || camBusy) return;
  var prev = cam.facing;
  var next = prev === 'user' ? 'environment' : 'user';
  cam.switching = true;
  var flip = $('#cam-flip'); if (flip) flip.disabled = true;
  var shot = $('#cam-shot'); if (shot) shot.disabled = true;
  var msg = $('#cam-msg');
  if (msg) { msg.textContent = '카메라를 전환하고 있어요…'; msg.hidden = false; }
  // 기기에 따라 두 카메라를 동시에 열지 못하므로 지금 트랙을 먼저 끝낸다
  try { if (cam.stream) cam.stream.getTracks().forEach(function(tr){ try { tr.stop(); } catch (e) {} }); } catch (e) {}
  if (cam.video) { try { cam.video.srcObject = null; } catch (e) {} }
  try {
    var stream = await camGetStream(next);
    if (!cam) { stream.getTracks().forEach(function(tr){ try { tr.stop(); } catch (e) {} }); return; }
    cam.stream = stream;
    cam.video.srcObject = stream;
    try { await cam.video.play(); } catch (e) {}
    if (msg) msg.hidden = true;
    camApplyMode(next);
  } catch (err) {
    console.error('카메라 전환 실패', err);
    var back = null;
    try { back = await camGetStream(prev); } catch (e2) { back = null; }
    if (!cam) {
      if (back) back.getTracks().forEach(function(tr){ try { tr.stop(); } catch (e) {} });
      return;
    }
    if (back) {
      cam.stream = back;
      cam.video.srcObject = back;
      try { await cam.video.play(); } catch (e) {}
      if (msg) msg.hidden = true;
      camApplyMode(prev);
      toast('이 기기에서는 카메라를 전환하지 못했어요.', 3200);
    } else if (msg) {
      msg.textContent = '카메라를 다시 열지 못했어요. 닫았다가 다시 열어 주세요.';
      toast('카메라를 전환하지 못했어요.', 3200);
    }
  } finally {
    if (cam) {
      cam.switching = false;
      var f2 = $('#cam-flip'); if (f2) f2.disabled = false;
      var s2 = $('#cam-shot'); if (s2 && cam.stream) s2.disabled = false;
    }
  }
}
function camCountText(){
  var c = $('#cam-count');
  if (!c) return;
  var n = (cam && cam.saved) || 0;
  c.innerHTML = esc(n + '장 저장됨') + (prefs.gallerySave ? '<em class="cam-sub">갤러리에도 저장</em>' : '');
}
function camFlash(){
  var f = $('#cam-flash');
  if (!f) return;
  f.classList.add('on');
  setTimeout(function(){ f.classList.remove('on'); }, 90);
}
async function openCamera(){
  if (cam) return;
  if (!S.recordDate) return;
  if (!cameraAvailable()) {
    cameraFallback('이 브라우저에서는 앱 안 카메라를 쓸 수 없어요. 휴대폰 카메라로 열게요.');
    return;
  }
  var date = S.recordDate;
  var el = document.createElement('div');
  el.className = 'cam';
  el.id = 'cam';
  el.innerHTML =
    '<div class="cam-top">' +
      '<button class="cam-close" id="cam-close" aria-label="카메라 닫기">✕</button>' +
      '<span class="cam-title">사진 찍기</span>' +
      '<button class="cam-flip" id="cam-flip" aria-label="셀카·후면 카메라 전환">' +
        '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 13.6-2.9L20 8.6"/><path d="M20 4.6v4h-4"/><path d="M20 15a8 8 0 0 1-13.6 2.9L4 15.4"/><path d="M4 19.4v-4h4"/></svg>' +
        '<span class="flip-tx">전환</span>' +
      '</button>' +
    '</div>' +
    '<div class="cam-stage">' +
      '<video id="cam-video" playsinline autoplay muted></video>' +
      '<div class="cam-flash" id="cam-flash"></div>' +
      '<span class="cam-mode" id="cam-mode">후면 카메라</span>' +
      '<div class="cam-msg" id="cam-msg">카메라를 준비하고 있어요…</div>' +
    '</div>' +
    '<div class="cam-strip">' +
      '<span class="cam-count" id="cam-count">0장 저장됨</span>' +
      '<div class="cam-thumbs" id="cam-thumbs"></div>' +
    '</div>' +
    '<div class="cam-bottom">' +
      '<button class="cam-done" id="cam-done">완료</button>' +
      '<button class="shutter" id="cam-shot" aria-label="촬영" disabled></button>' +
      '<span aria-hidden="true"></span>' +
    '</div>';
  document.body.appendChild(el);
  cam = {
    el: el, stream: null, video: $('#cam-video'), date: date, historyPushed: false,
    facing: 'environment', saved: 0, gallerySaved: 0, urls: [], switching: false
  };
  camCountText();
  // 안드로이드 뒤로 가기가 카메라만 닫도록 히스토리에 한 칸을 남긴다
  try {
    history.pushState({ record: date, camera: true }, '', '#day=' + date);
    cam.historyPushed = true;
  } catch (e) { cam.historyPushed = false; }
  $('#cam-close').addEventListener('click', closeCamera);
  $('#cam-done').addEventListener('click', closeCamera);
  $('#cam-flip').addEventListener('click', switchCamera);
  $('#cam-shot').addEventListener('click', takeShot);
  document.addEventListener('keydown', camKeys);
  try {
    var stream = await camGetStream('environment');
    if (!cam) { // 여는 동안 닫혔으면 바로 정리
      stream.getTracks().forEach(function(tr){ try { tr.stop(); } catch (e) {} });
      return;
    }
    cam.stream = stream;
    cam.video.srcObject = stream;
    try { await cam.video.play(); } catch (e) {}
    var msg = $('#cam-msg');
    if (msg) msg.hidden = true;
    var shot = $('#cam-shot');
    if (shot) shot.disabled = false;
    camApplyMode('environment');
  } catch (err) {
    var name = (err && err.name) || '';
    var text;
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      text = '카메라 권한이 꺼져 있어요. 주소창 옆 자물쇠 → 카메라 → 허용으로 바꾸면 앱 안에서 찍을 수 있어요. 지금은 휴대폰 카메라로 열게요.';
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      text = '사용할 수 있는 카메라를 찾지 못했어요. 휴대폰 카메라로 열게요.';
    } else {
      text = '카메라를 열지 못했어요. 휴대폰 카메라로 열게요.';
    }
    stopCamera();
    cameraFallback(text);
  }
}
/* 셔터 한 번 = 사진 한 장. 카메라는 열어 둔 채로 바로 IndexedDB에 저장해
 * 다시 누르면 다음 장을 이어서 찍는다. */
async function takeShot(){
  if (!cam || camBusy) return;
  var v = cam.video;
  var vw = v ? v.videoWidth : 0;
  var vh = v ? v.videoHeight : 0;
  if (!vw || !vh) {
    toast('카메라 화면이 아직 준비되지 않았어요. 잠시 뒤 다시 눌러 주세요.');
    return;
  }
  camBusy = true;
  var shotBtn = $('#cam-shot');
  if (shotBtn) shotBtn.disabled = true;
  var date = cam.date;
  var scale = Math.min(1, CAPTURE_MAX / Math.max(vw, vh));
  var cw = Math.max(1, Math.round(vw * scale));
  var ch = Math.max(1, Math.round(vh * scale));
  var canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cw, ch);
  if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(v, 0, 0, cw, ch);
  camFlash(); // 셔터가 눌린 것을 바로 알 수 있게
  var blob = await new Promise(function(resolve){
    canvas.toBlob(function(b){ resolve(b); }, 'image/jpeg', PHOTO_Q);
  });
  canvas.width = canvas.height = 0; // 캔버스 메모리 즉시 해제
  if (!cam) { camBusy = false; return; } // 찍는 사이 닫혔으면 그만
  if (!blob) {
    camBusy = false;
    if (shotBtn) shotBtn.disabled = false;
    toast('사진을 담지 못했어요. 다시 찍어 주세요.');
    return;
  }
  // 다이어리 저장과 함께 기기 갤러리(다운로드 폴더)에도 바로 저장한다.
  // 썸네일·IndexedDB 저장을 기다리지 않고 지금 내려받아야
  // 브라우저가 '사용자 조작'으로 인정해 연속 촬영에서도 다운로드가 막히지 않는다.
  var galleryName = '';
  if (prefs.gallerySave) galleryName = downloadBlob(blob, photoFileName(date, blob));
  var slot = document.createElement('span');
  slot.className = 'slot';
  slot.textContent = '저장';
  var thumbs = $('#cam-thumbs');
  if (thumbs) thumbs.appendChild(slot);
  try {
    var thumb = null;
    try { thumb = await makeThumb(blob); } catch (e) { thumb = null; }
    var order = S.recordPhotos.reduce(function(m, p){ return Math.max(m, p.order || 0); }, -1) + 1;
    var id = await addPhotoRecord({ date: date, blob: blob, thumb: thumb, order: order, caption: '' });
    var meta = { id: id, date: date, order: order, caption: '', thumb: thumb };
    S.recordPhotos.push(meta);
    S.photoIndex.push(meta);
    if (S.view === 'record' && S.recordDate === date) {
      renderPhotoGrid();
      await saveOrderValues(normalizeOrders());
    }
    if (!cam) return; // 저장하는 사이 닫혔으면 화면에 표시할 곳이 없다
    cam.saved = (cam.saved || 0) + 1;
    cam.gallerySaved = (cam.gallerySaved || 0) + (galleryName ? 1 : 0);
    camCountText();
    if (slot.parentNode) {
      if (thumb) {
        var u = URL.createObjectURL(thumb);
        cam.urls.push(u);
        var img = document.createElement('img');
        img.src = u;
        img.alt = '방금 찍은 사진 ' + cam.saved;
        slot.parentNode.replaceChild(img, slot);
      } else {
        slot.parentNode.removeChild(slot);
      }
    }
  } catch (e) {
    console.error('촬영 저장 실패', e);
    if (slot.parentNode) slot.parentNode.removeChild(slot);
    toast('사진을 저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요.');
  } finally {
    camBusy = false;
    if (cam) {
      var b = $('#cam-shot');
      if (b && cam.stream) b.disabled = false;
    }
  }
}

/* ---------- 라이트박스 ---------- */
function openLightbox(items, index){
  if (!items || !items.length) return;
  S.lb = { items: items, i: index, startX: 0, startY: 0, moved: false };
  var el = document.createElement('div');
  el.className = 'lb';
  el.id = 'lb';
  el.innerHTML =
    '<div class="lb-top"><span class="lb-count" id="lb-count"></span><button class="lb-close" id="lb-close" aria-label="닫기">✕</button></div>' +
    '<div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>' +
    '<div class="lb-cap"><div class="lb-date" id="lb-date"></div><div class="lb-text" id="lb-text"></div></div>' +
    '<div class="lb-actions"><button class="lb-save" id="lb-save">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 18.5h14"/></svg>' +
      '<span id="lb-save-tx">갤러리 저장</span></button></div>' +
    '<div class="lb-navrow">' +
      '<button id="lb-prev" aria-label="이전 사진">‹</button>' +
      '<span class="mid" id="lb-mid"></span>' +
      '<button id="lb-next" aria-label="다음 사진">›</button>' +
    '</div>';
  document.body.appendChild(el);
  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lb-save').addEventListener('click', lbSaveToGallery);
  $('#lb-prev').addEventListener('click', function(){ lbGo(-1); });
  $('#lb-next').addEventListener('click', function(){ lbGo(1); });
  var stage = $('#lb-stage');
  stage.addEventListener('touchstart', function(e){
    if (!e.touches || !e.touches.length) return;
    S.lb.startX = e.touches[0].clientX;
    S.lb.startY = e.touches[0].clientY;
    S.lb.moved = false;
  }, { passive: true });
  stage.addEventListener('touchmove', function(){
    S.lb.moved = true;
  }, { passive: true });
  stage.addEventListener('touchend', function(e){
    if (!e.changedTouches || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - S.lb.startX;
    var dy = e.changedTouches[0].clientY - S.lb.startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) lbGo(dx > 0 ? -1 : 1);
  });
  document.addEventListener('keydown', lbKeys);
  lbShow();
}
function lbKeys(e){
  if (!S.lb) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lbGo(-1);
  else if (e.key === 'ArrowRight') lbGo(1);
}
/* 크게 보기에서 보고 있는 사진을 기기 갤러리(다운로드 폴더)로 꺼낸다 */
async function lbSaveToGallery(){
  if (!S.lb) return;
  var p = S.lb.items[S.lb.i];
  if (!p) return;
  var btn = $('#lb-save');
  if (btn) btn.disabled = true;
  try {
    var rec = await getOne('photos', p.id);
    if (!rec || !rec.blob) throw new Error('사진을 찾지 못했습니다');
    var name = downloadBlob(rec.blob, photoFileName(p.date || rec.date, rec.blob));
    if (!name) throw new Error('내려받기를 시작하지 못했습니다');
    var tx = $('#lb-save-tx');
    if (tx) {
      tx.textContent = '저장했어요';
      setTimeout(function(){ if (tx.isConnected) tx.textContent = '갤러리 저장'; }, 1800);
    }
    toast('갤러리에 저장했어요 · ' + name, 3200);
  } catch (e) {
    console.error('갤러리 저장 실패', e);
    toast('갤러리에 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  } finally {
    setTimeout(function(){ if (btn && btn.isConnected) btn.disabled = false; }, 700);
  }
}
function closeLightbox(){
  document.removeEventListener('keydown', lbKeys);
  if (S.lb && S.lb.prevFullId) forgetFull(S.lb.prevFullId);
  var el = $('#lb');
  if (el) el.remove();
  S.lb = null;
}
async function lbGo(delta){
  if (!S.lb) return;
  var n = S.lb.i + delta;
  if (n < 0 || n >= S.lb.items.length) return;
  S.lb.i = n;
  await lbShow();
}
async function lbShow(){
  if (!S.lb) return;
  var items = S.lb.items, i = S.lb.i;
  var p = items[i];
  if (!p) return;
  var img = $('#lb-img');
  var countEl = $('#lb-count');
  var dateEl = $('#lb-date');
  var textEl = $('#lb-text');
  if (!img) return;
  countEl.textContent = (i + 1) + ' / ' + items.length;
  var mid = $('#lb-mid');
  if (mid) mid.textContent = (i + 1) + ' / ' + items.length;
  var prevB = $('#lb-prev'), nextB = $('#lb-next');
  if (prevB) prevB.disabled = i <= 0;
  if (nextB) nextB.disabled = i >= items.length - 1;
  var t = thumbUrl(p);
  if (t) { img.src = t; img.hidden = false; }
  else { img.removeAttribute('src'); img.hidden = true; }
  // 앞 사진의 풀사이즈 objectURL 은 바로 정리해 누적되지 않게
  if (S.lb.prevFullId && S.lb.prevFullId !== p.id) forgetFull(S.lb.prevFullId);
  S.lb.prevFullId = p.id;
  var day = dayOf(p.date) || {};
  var bits = [];
  if (day.place) bits.push(day.place);
  if (day.people) bits.push(day.people);
  if (day.food) bits.push(day.food);
  dateEl.textContent = koreanDate(p.date) + (relDay(p.date) ? ' · ' + relDay(p.date) : '');
  textEl.textContent = bits.join(' · ');
  var cur = i;
  try {
    var full = await fullUrl(p.id);
    if (full && S.lb && S.lb.i === cur) { img.src = full; img.hidden = false; }
  } catch (e) {}
}

/* ---------- 화면: 갤러리 ---------- */
function galleryArrays(){
  var peopleCount = {}, placeCount = {};
  S.days.forEach(function(d){
    splitPeople(d.people).forEach(function(n){ peopleCount[n] = (peopleCount[n] || 0) + 1; });
    var pl = (d.place || '').trim();
    if (pl) placeCount[pl] = (placeCount[pl] || 0) + 1;
  });
  return {
    people: Object.keys(peopleCount).sort(function(a, b){ return peopleCount[b] - peopleCount[a] || a.localeCompare(b); }),
    places: Object.keys(placeCount).sort(function(a, b){ return placeCount[b] - placeCount[a] || a.localeCompare(b); })
  };
}
function filteredPhotos(){
  var f = S.galleryFilter;
  var out = S.photoIndex.slice();
  if (f.people) {
    out = out.filter(function(p){
      var d = dayOf(p.date);
      return d && splitPeople(d.people).indexOf(f.people) >= 0;
    });
  }
  if (f.place) {
    out = out.filter(function(p){
      var d = dayOf(p.date);
      return d && (d.place || '').trim() === f.place;
    });
  }
  out.sort(function(a, b){
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return (a.order || 0) - (b.order || 0);
  });
  return out;
}
function renderGallery(){
  var opts = galleryArrays();
  var f = S.galleryFilter;
  var photos = filteredPhotos();

  var groups = [];
  var curDate = null, cur = null;
  photos.forEach(function(p){
    if (p.date !== curDate) { cur = { date: p.date, photos: [] }; groups.push(cur); curDate = p.date; }
    cur.photos.push(p);
  });

  function chip(label, active, attrs){
    return '<button class="chip' + (active ? ' on' : '') + '" ' + attrs + '>' + esc(label) + '</button>';
  }
  var peopleRow = chip('전체', !f.people, 'data-fpeople=""') +
    opts.people.map(function(n){ return chip(n, f.people === n, 'data-fpeople="' + esc(n) + '"'); }).join('');
  var placeRow = chip('전체', !f.place, 'data-fplace=""') +
    opts.places.map(function(n){ return chip(n, f.place === n, 'data-fplace="' + esc(n) + '"'); }).join('');

  var body;

    body = '<div class="empty-card"><img class="app-icon" src="icon-192.png" alt=""><h3>아직 사진이 없어요</h3><p>달력에서 날짜를 눌러 사진을 담으면<br>여기에 날짜별로 모여요.</p></div>';
  } else if (!photos.length) {
    body = '<div class="hint-box">조건에 맞는 사진이 없어요.<br>필터를 바꾸거나 ‘전체’를 눌러 주세요.</div>';
  } else {
    body = groups.map(function(g){
      var day = dayOf(g.date) || {};
      var meta = [];
      if (day.place) meta.push(day.place);
      if (day.people) meta.push(day.people);
      if (day.food) meta.push(day.food);
      var open = !!S.galleryOpen[g.date] || g.photos.length <= 5;
      var shown = open ? g.photos : g.photos.slice(0, 5);
      var grid = shown.map(function(p, i){
        var u = thumbUrl(p);
        var inner = u ? '<img src="' + u + '" alt="" loading="lazy">' : '<span style="position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:11px">사진</span>';
        return '<button class="ph" data-gal-date="' + g.date + '" data-gal-idx="' + i + '">' + inner + '</button>';
      }).join('');
      var more = (!open && g.photos.length > 5)
        ? '<button class="more-btn" data-more="' + g.date + '">' + (g.photos.length - 5) + '장 더보기</button>'
        : (open && g.photos.length > 5 && S.galleryOpen[g.date])
          ? '<button class="more-btn" data-less="' + g.date + '">접기</button>'
          : '';
      return '<section class="gal-day" data-gdate="' + g.date + '">' +
        '<div class="gal-head"><span class="gal-date">' + shortDate(g.date) + (relDay(g.date) ? ' · ' + relDay(g.date) : '') + '</span>' +
        '<span class="gal-meta">' + esc(meta.join(' · ') || '사진 ' + g.photos.length + '장') + '</span></div>' +
        '<div class="gal-grid">' + grid + '</div>' + more +

    }).join('');
  }

  $('#view').innerHTML =
    '<header class="topbar"><div class="brand">갤러리<small>사진 ' + S.photoIndex.length + '장 · 날짜별로 모아 봐요</small></div>' +

        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7.4h8M17.6 7.4H20M4 16.6h2.4M11.4 16.6H20"/><circle cx="14.8" cy="7.4" r="2.1"/><circle cx="8.8" cy="16.6" r="2.1"/></svg>' +
      '</button></header>' +

        '<div class="filter-row"><span class="flabel">사람</span><div class="fchips" id="fp">' + peopleRow + '</div></div>' +

  });
  $all('[data-less]').forEach(function(b){
    b.addEventListener('click', function(){ delete S.galleryOpen[b.getAttribute('data-less')]; renderGallery(); });
  });
  $all('[data-gal-idx]').forEach(function(b){
    b.addEventListener('click', function(){
      var date = b.getAttribute('data-gal-date');
      var idx = Number(b.getAttribute('data-gal-idx'));
      var g = groups.filter(function(x){ return x.date === date; })[0];
      if (!g) return;
      var open = !!S.galleryOpen[date] || g.photos.length <= 5;
      var items = open ? g.photos : g.photos.slice(0, 5);
      openLightbox(items, idx);
    });
  });
}

function searchResults(q){
  var needle = String(q || '').trim().toLowerCase();
  if (!needle) return [];
  var byDate = {};
  S.photoIndex.forEach(function(p){
    if (!byDate[p.date]) byDate[p.date] = [];
    byDate[p.date].push(p);
  });
  Object.keys(byDate).forEach(function(d){
    byDate[d].sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
  });
  var dates = {};
  S.days.forEach(function(d){ dates[d.date] = true; });
  Object.keys(byDate).forEach(function(d){ dates[d] = true; });

  var out = [];
  Object.keys(dates).forEach(function(date){
    var day = dayOf(date) || {};
    var fields = [day.title, day.people, day.place, day.food, day.memo];
    var hay = fields.filter(Boolean).join(' ').toLowerCase();
    if (hay.indexOf(needle) < 0) return;
    out.push({
      date: date,
      day: day,
      photos: byDate[date] || []
    });
  });
  out.sort(function(a, b){ return b.date.localeCompare(a.date); });
  return out;
}

function blobToDataURL(blob){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(fr.result); };
    fr.onerror = function(){ reject(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataUrl){
  var parts = String(dataUrl).split(',');
  var meta = parts[0] || '';
  var mime = (meta.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  var bin = atob(parts[1] || '');
  var len = bin.length;
  var arr = new Uint8Array(len);
  for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function exportAll(){
  var settings = $('#settings');
  if (settings) settings.remove();
  showBusy('내보내기 준비 중…');
  try {
    var days = await getAll('days');
    var photos = await getAll('photos');
    var out = {
      app: 'photo-diary',
      schema: 1,
      version: APP_VERSION,
      exportedAt: new Date().toISOString(),
      days: days,
      photos: []
    };
    for (var i = 0; i < photos.length; i++) {
      var p = photos[i];
      updateBusy('내보내는 중… ' + (i + 1) + '/' + photos.length);
      var item = {
        id: p.id,
        date: p.date,
        order: p.order || 0,
        caption: p.caption || '',
        blob: p.blob ? await blobToDataURL(p.blob) : null,
        thumb: p.thumb ? await blobToDataURL(p.thumb) : null
      };
      out.photos.push(item);
    }
    var json = JSON.stringify(out);
    var blob = new Blob([json], { type: 'application/json' });
    var name = '다이어리-백업-' + todayStr().replace(/-/g, '') + '.json';
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 4000);
    hideBusy();
    toast('내보냈어요 · ' + name + ' (' + Math.max(1, Math.round(json.length / 1024)) + 'KB)');
  } catch (e) {
    console.error(e);
    hideBusy();
    toast('내보내기에 실패했어요. 사진 수가 많으면 나눠서 시도해 주세요.');
  }
}
async function importAll(file){
  var settings = $('#settings');
  if (settings) settings.remove();
  showBusy('가져오기 준비 중…');
  try {
    var text = await file.text();
    var obj = JSON.parse(text);
    if (!obj || obj.app !== 'photo-diary' || !Array.isArray(obj.days) || !Array.isArray(obj.photos)) {
      throw new Error('형식이 다릅니다');
    }
    var addedDays = 0, skippedDays = 0, addedPhotos = 0, skippedPhotos = 0;
    var existing = {};
    S.days.forEach(function(d){ existing[d.date] = true; });
    for (var i = 0; i < obj.days.length; i++) {
      var d = obj.days[i];
      if (!d || !d.date) continue;
      if (existing[d.date]) { skippedDays++; continue; }
      await putOne('days', {
        date: d.date,
        title: d.title || '',
        people: d.people || '',
        place: d.place || '',
        food: d.food || '',
        memo: d.memo || '',
        rating: d.rating || 0,
        createdAt: d.createdAt || new Date().toISOString(),
        updatedAt: d.updatedAt || new Date().toISOString()
      });
      existing[d.date] = true;
      addedDays++;
    }
    var existingPhoto = {};
    S.photoIndex.forEach(function(p){ existingPhoto[p.id] = true; });
    for (var j = 0; j < obj.photos.length; j++) {
      updateBusy('가져오는 중… ' + (j + 1) + '/' + obj.photos.length);
      var p = obj.photos[j];
      if (!p || p.date == null) continue;
      var pid = Number(p.id);
      if (!isFinite(pid) || existingPhoto[pid]) { skippedPhotos++; continue; }
      try {
        await importPhotoRecord(pid, {
          date: p.date,
          blob: p.blob ? dataURLToBlob(p.blob) : new Blob([], { type: 'image/jpeg' }),
          thumb: p.thumb ? dataURLToBlob(p.thumb) : null,
          order: Number(p.order) || 0,
          caption: p.caption || ''
        });
        existingPhoto[pid] = true;
        addedPhotos++;
      } catch (e) {
        console.warn('사진 건너뜀', pid, e);
        skippedPhotos++;
      }
    }
    await reloadAll();
    hideBusy();
    if (S.view === 'record') { closeRecord(); }
    render();
    toast('가져왔어요 · 기록 ' + addedDays + '일, 사진 ' + addedPhotos + '장 (건너뜀 ' + (skippedDays + skippedPhotos) + ')');
  } catch (e) {
    console.error(e);
    hideBusy();
    toast('가져오지 못했어요. 이 앱에서 내보낸 JSON인지 확인해 주세요.');
  }
}

/* ---------- 공통 UI ---------- */
function confirmDialog(title, body, okText, cancelText){
  return new Promise(function(resolve){
    var wrap = document.createElement('div');
    wrap.className = 'backdrop center';
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>' + esc(title) + '</h3>' +
        '<p>' + esc(body) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="btn" data-x="cancel">' + esc(cancelText || '취소') + '</button>' +
          '<button class="btn primary" data-x="ok">' + esc(okText || '확인') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function(e){
      var b = e.target.closest('[data-x]');
      if (b) {
        var ok = b.getAttribute('data-x') === 'ok';
        wrap.remove();
        resolve(ok);
      } else if (e.target === wrap) {
        wrap.remove();
        resolve(false);
      }
    });
  });
}
var toastTimer = null;
function toast(msg, ms){
  var t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms || 2800);
}
var busyEl = null;
function showBusy(msg){
  if (!busyEl) {
    busyEl = document.createElement('div');
    busyEl.className = 'busy';
    busyEl.innerHTML = '<div class="box"><div class="spinner"></div><div class="msg" id="busy-msg"></div></div>';
    document.body.appendChild(busyEl);
  }
  updateBusy(msg || '처리 중…');
}
function updateBusy(msg){
  var el = $('#busy-msg');
  if (el) el.textContent = msg || '처리 중…';
}
function hideBusy(){
  if (busyEl) { busyEl.remove(); busyEl = null; }
}

/* ---------- 시작 ---------- */
async function reloadAll(){
  var res = await Promise.all([getAll('days'), getAll('photoIndex')]);
  S.days = res[0];
  S.photoIndex = res[1];
  // 사라진 사진의 objectURL 정리(메모리 누수 방지)
  var alive = {};
  S.photoIndex.forEach(function(p){ alive[p.id] = true; });
  Object.keys(thumbUrls).forEach(function(id){ if (!alive[id]) forgetThumb(id); });
  Object.keys(fullUrls).forEach(function(id){ if (!alive[id]) forgetFull(id); });
}
function bindGlobal(){
  $all('.tab', $('#tabbar')).forEach(function(b){
    b.addEventListener('click', function(){ goTab(b.getAttribute('data-tab')); });
  });
  document.addEventListener('visibilitychange', function(){
    // 다른 앱으로 갈 때 카메라 스트림과 타이핑 중 저장을 마무리한다
    if (document.hidden) { if (cam) stopCamera(); flushSave(); }
  });
}
function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  var go = function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if (!reg) return;
      // 설치가 끝난 새 버전은 바로 넘겨받는다(skipWaiting + clients.claim)
      try { if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            try { nw.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
          }
        });
      });
      // 업데이트가 있으면 바로 확인해 받아온다
      if (reg.update) { try { reg.update(); } catch (e) {} }
    }).catch(function(e){
      console.warn('서비스 워커 등록 실패', e);
    });
  };
  if (hadController) {
    // 이미 설치된 앱을 새 버전으로 바꿀 때: 입력 중이던 내용을 저장하고 한 번만 새로고침
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (reloading) return;
      reloading = true;
      var done = function(){ try { location.reload(); } catch (e) {} };
      try { flushSave().then(done, done); } catch (e) { done(); }
    });
  }
  if (document.readyState === 'complete') go();
  else window.addEventListener('load', go);
}
async function boot(){
  if (!('indexedDB' in window)) {
    $('#view').innerHTML = '<div class="view" style="padding-top:40px"><div class="empty-card"><h3>이 브라우저에서는 저장소를 쓸 수 없어요</h3><p>크롬이나 사파리의 최신 버전에서 열어 주세요.</p></div></div>';
    return;
  }
  try {
    await openDB();
    await reloadAll();
  } catch (e) {
    console.error('DB 열기 실패', e);
    $('#view').innerHTML = '<div class="view" style="padding-top:40px"><div class="empty-card"><h3>저장 공간을 열지 못했어요</h3><p>브라우저의 사생활 보호 모드를 끄고 다시 열어 주세요.</p></div></div>';
    return;
  }
  bindGlobal();
  var hashDay = readHashDay();
  if (hashDay) {
    // 새로고침·다시 열기 뒤에도 보던 날짜 기록 화면을 그대로 보여 준다
    S.historyPushed = true;
    await openRecord(hashDay, true);
  } else {
    render();
  }
  registerSW();
}

/* 테스트에서 내부 상태를 확인할 수 있도록 최소한만 노출 (사용에는 영향 없음) */
window.__diary = {
  state: S,
  version: APP_VERSION,
  prefs: prefs,
  koreanDate: koreanDate,
  todayStr: todayStr,
  reloadAll: reloadAll,
  pendingDownloads: function(){ return dlPending.map(function(x){ return x.name; }); }
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
